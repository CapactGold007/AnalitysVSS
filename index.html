<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>VSS - Árvore Hierárquica Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-screen" class="auth-container">
        <h1>VSS SYSTEM</h1>
        <div class="auth-box">
            <input type="text" id="username" placeholder="Nome de Usuário (Só cadastro)">
            <input type="email" id="email" placeholder="Seu E-mail">
            <input type="password" id="pass" placeholder="Sua Senha">
            <div class="auth-buttons">
                <button id="btn-login">Entrar</button>
                <button id="btn-cadastro">Criar Conta</button>
            </div>
        </div>
    </div>

    <div id="main-site" style="display:none;">
        <aside class="sidebar">
            <div id="status-bar"></div>
            <nav>
                <button onclick="mudarAba('chat')">💬 Chat Global</button>
                <button onclick="mudarAba('arvore')">🌳 Árvore Genealógica</button>
                <button onclick="mudarAba('perfil')">👤 Meu Perfil</button>
                <button id="btn-sair" style="color: #ff4444;">🚪 Sair</button>
            </nav>
        </aside>

        <main class="content">
            <section id="aba-chat">
                <div id="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="msg-input" placeholder="Digite uma mensagem...">
                    <button id="btn-enviar">Enviar</button>
                </div>
            </section>

            <section id="aba-arvore" style="display:none;">
                <h2>Árvore Hierárquica VSS</h2>
                <div class="tree-container">
                    <div class="tree" id="tree-display"></div>
                </div>
            </section>

            <section id="aba-perfil" style="display:none;">
                <h2>Meu Perfil</h2>
                <div id="perfil-detalhes" class="card"></div>
            </section>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
