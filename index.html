<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>VSS SYSTEM - COMPLETO</title>
    <style>
        body { background: #0a0a0a; color: #eee; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Organizada */
        .sidebar { width: 260px; background: #111; border-right: 1px solid #222; padding: 20px; display: flex; flex-direction: column; gap: 5px; }
        .sidebar button { background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 6px; cursor: pointer; text-align: left; font-weight: bold; transition: 0.2s; }
        .sidebar button:hover { background: #333; border-color: #5865f2; }
        .btn-staff { background: #440000 !important; border: 1px solid #ff4444 !important; margin-top: 10px; color: #ffcccc !important; text-align: center !important; }
        
        #status-bar { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #5865f2; }
        .content { flex: 1; padding: 30px; overflow-y: auto; background: #0d0d0d; position: relative; }
        .card { background: #111; padding: 20px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }

        /* Árvore de Cargos Visual */
        .tree ul { padding-top: 20px; position: relative; display: flex; justify-content: center; padding-left: 0; }
        .tree li { list-style: none; position: relative; padding: 20px 5px 0 5px; text-align: center; }
        .tree b { border: 2px solid #444; padding: 8px 12px; display: inline-block; border-radius: 5px; background: #1a1a1a; font-size: 11px; color: #fff; }

        /* Estilo da Prova IA */
        #prova-container { display: none; background: #000; padding: 30px; border: 2px solid #ff4444; border-radius: 12px; }
        .questao { margin-bottom: 15px; padding: 15px; background: #151515; border-radius: 8px; border-left: 4px solid #ff4444; }
        
        input, textarea { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        #top-news { background: #ff4500; color: white; padding: 12px; text-align: center; font-weight: bold; position: fixed; top: 0; left: 260px; right: 0; z-index: 1000; display: none; }
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="top-news">📢 <span id="news-text">...</span></div>

    <div id="auth-screen">
        <div style="background:#111; padding:30px; border-radius:10px; width:300px; border:1px solid #333">
            <h2 style="text-align:center; color:#5865f2">VSS LOGIN</h2>
            <input type="text" id="reg-nome" placeholder="Nome" style="margin-bottom:10px">
            <input type="email" id="auth-email" placeholder="E-mail" style="margin-bottom:10px">
            <input type="password" id="auth-senha" placeholder="Senha" style="margin-bottom:10px">
            <button id="btn-login" style="width:100%; background:#5865f2; color:white; padding:12px; border:none; border-radius:6px; cursor:pointer">ENTRAR / CRIAR</button>
        </div>
    </div>

    <div id="main-app" style="display:none; width:100%;">
        <aside class="sidebar">
            <div id="status-bar"></div>
            <button onclick="aba('aba-chat')">💬 CHAT GLOBAL</button>
            <button onclick="aba('aba-perfil')">👤 MEU PERFIL</button>
            <button onclick="aba('aba-cargos')">🎖️ HIERARQUIA</button>
            <button onclick="aba('aba-noticias')">📢 NOTÍCIAS</button>
            <button onclick="aba('aba-membros')">👥 MEMBROS</button>
            
            <!-- Botão Staff no Canto/Separado -->
            <button onclick="aba('aba-prova')" class="btn-staff">🔒 PROVA STAFF (IA)</button>
            
            <button id="btn-sair" style="color:#ff4444; margin-top:auto; border:none; background:none">SAIR</button>
        </aside>

        <main class="content" style="padding-top: 60px;">
            <!-- ABA PERFIL -->
            <section id="aba-perfil" style="display:none">
                <div id="perfil-card" class="card"></div>
            </section>

            <!-- ABA CARGOS -->
            <section id="aba-cargos" style="display:none">
                <div class="tree" id="tree-root"></div>
            </section>

            <!-- ABA CHAT -->
            <section id="aba-chat">
                <div id="chat-messages" style="height:60vh; overflow-y:auto; background:#050505; padding:15px; border-radius:8px; border:1px solid #222; margin-bottom:10px"></div>
                <input type="text" id="chat-input" placeholder="Conversar...">
            </section>

            <!-- ABA PROVA STAFF -->
            <section id="aba-prova" style="display:none">
                <div id="prova-lock-msg" class="card">
                    <h2>Formulário Trancado</h2>
                    <p>Apenas Soldados+ e quando o Fundador liberar.</p>
                </div>
                <div id="prova-container">
                    <h2 style="color:#ff4444">TESTE STAFF - 100 QUESTÕES IA</h2>
                    <div id="questoes-lista"></div>
                    <button onclick="corrigirProva()" style="background:#5865f2; color:white; width:100%; padding:20px; border:none; cursor:pointer; font-size:18px">FINALIZAR TESTE</button>
                </div>
            </section>

            <!-- OUTRAS ABAS -->
            <section id="aba-noticias" style="display:none">
                <div class="card">
                    <h2>📢 Postar Notícia</h2>
                    <textarea id="news-input" placeholder="Texto da notícia..."></textarea>
                    <button id="btn-post-news" style="background:#ff4500; color:white; border:none; padding:10px; margin-top:10px; cursor:pointer">PUBLICAR</button>
                </div>
            </section>

            <section id="aba-membros" style="display:none">
                <div id="lista-membros" class="card"></div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, orderBy, addDoc, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDK-yme2jxzdjvunQqkuB26r3oKH4OOS0I", authDomain: "analitysvss.firebaseapp.com", projectId: "analitysvss", storageBucket: "analitysvss.firebasestorage.app", messagingSenderId: "665486639760", appId: "1:665486639760:web:16dd3ee053cd283f5e4e15" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        let uData = null;
        let emProva = false;

        // Anti-Cheat
        window.onblur = () => { if(emProva) { alert("Sair da aba cancelou sua prova!"); location.reload(); } };

        window.aba = (id) => {
            if(id === 'aba-prova' && uData.nivel < 2) return alert("Precisa ser SOLDADO!");
            document.querySelectorAll('section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        };

        const CARGOS = {"1":{n:"INICIANTE",c:"#fff"}, "2":{n:"SOLDADO",c:"#2ecc71"}, "15":{n:"FUNDADOR",c:"#ff0000"}};

        onAuthStateChanged(auth, u => {
            if(u) {
                onSnapshot(doc(db, "usuarios", u.uid), s => {
                    uData = s.data(); uData.uid = u.uid;
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'flex';
                    const cargoInfo = CARGOS[uData.nivel] || {n:"MEMBRO", c:"#fff"};
                    
                    document.getElementById('status-bar').innerHTML = `<b>${uData.nome}</b><br><small>${cargoInfo.n}</small>`;
                    document.getElementById('perfil-card').innerHTML = `<h2>Meu Perfil</h2><p>Nome: ${uData.nome}</p><p>Cargo: <b style="color:${cargoInfo.c}">${cargoInfo.n}</b></p><p>XP: ${uData.xp || 0}</p>`;
                    
                    // Render Árvore Simplificada (Y após Marechal)
                    document.getElementById('tree-root').innerHTML = `<ul><li><b>FUNDADOR</b><ul><li><b>MARECHAL</b><ul><li><b>AUTORIDADE A</b></li><li><b>SÓCIO B</b></li></ul></li></ul></li></ul>`;
                });

                // Status Prova
                onSnapshot(doc(db, "sistema", "config"), s => {
                    if(s.data()?.provaAberta) {
                        document.getElementById('prova-lock-msg').style.display = 'none';
                        document.getElementById('prova-container').style.display = 'block';
                        if(!emProva) gerarProvaIA();
                        emProva = true;
                    }
                });
            }
        });

        function gerarProvaIA() {
            const lista = document.getElementById('questoes-lista');
            lista.innerHTML = "";
            for(let i=1; i<=100; i++) {
                const n1 = Math.floor(Math.random()*100);
                const n2 = Math.floor(Math.random()*50);
                lista.innerHTML += `<div class="questao"><p>${i}. Quanto é ${n1} + ${n2}?</p><input type="number" class="res-ia" data-certa="${n1+n2}"></div>`;
            }
        }

        window.corrigirProva = async () => {
            let acertos = 0;
            document.querySelectorAll('.res-ia').forEach(inp => { if(inp.value == inp.dataset.certa) acertos++; });
            if(acertos >= 69) {
                alert("PROMOVIDO A STAFF!");
                await updateDoc(doc(db, "usuarios", uData.uid), { nivel: "10" });
                location.reload();
            } else { alert(`Você acertou ${acertos}. Tente de novo.`); location.reload(); }
        };

        document.getElementById('btn-login').onclick = async () => {
            const e = document.getElementById('auth-email').value;
            const p = document.getElementById('auth-senha').value;
            try { await signInWithEmailAndPassword(auth, e, p); } catch {
                const res = await createUserWithEmailAndPassword(auth, e, p);
                await setDoc(doc(db, "usuarios", res.user.uid), { nome: document.getElementById('reg-nome').value, nivel: "1", xp: 0 });
            }
        };

        document.getElementById('btn-sair').onclick = () => signOut(auth).then(()=>location.reload());
    </script>
</body>
</html>
