<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>VSS SYSTEM - SUPREMO</title>
    <style>
        body { background: #0a0a0a; color: #eee; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #top-news-bar { position: fixed; top: 0; left: 260px; right: 0; background: #ff4500; color: white; padding: 15px; text-align: center; font-weight: bold; z-index: 1000; display: none; border-bottom: 2px solid #fff; }
        .sidebar { width: 260px; background: #111; border-right: 1px solid #222; padding: 20px; display: flex; flex-direction: column; }
        .sidebar button { background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 12px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; text-align: left; font-weight: bold; width: 100%; }
        .sidebar button:hover { background: #333; }
        #status-bar { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #5865f2; font-size: 13px; }
        .content { flex: 1; padding: 80px 30px 30px 30px; overflow-y: auto; background: #0d0d0d; }
        #chat-messages { height: 50vh; background: #050505; border: 1px solid #222; padding: 15px; overflow-y: auto; border-radius: 8px; margin-bottom: 15px; }
        .card { background: #111; padding: 20px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }
        .membro-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #222; }
        .adm-tools { display: flex; gap: 5px; }
        .btn-adm { padding: 5px 8px; border-radius: 4px; border: none; cursor: pointer; font-size: 10px; font-weight: bold; color: white; }
        input, textarea { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="top-news-bar">📢 <span id="news-text">...</span></div>

    <div id="auth-screen">
        <div class="auth-box" style="background:#111; padding:30px; border-radius:10px; width:300px">
            <h2 style="text-align:center; color:#5865f2">VSS SYSTEM</h2>
            <input type="text" id="reg-nome" placeholder="Nome" style="margin-bottom:10px">
            <input type="email" id="auth-email" placeholder="E-mail" style="margin-bottom:10px">
            <input type="password" id="auth-senha" placeholder="Senha" style="margin-bottom:10px">
            <button id="btn-login" style="background:#5865f2; color:white; border:none; padding:12px; cursor:pointer; width:100%; border-radius:6px">ENTRAR</button>
            <button id="btn-cadastrar" style="background:none; color:#888; border:none; margin-top:10px; cursor:pointer; width:100%">CRIAR CONTA</button>
        </div>
    </div>

    <div id="main-app" style="display:none; width:100%;">
        <aside class="sidebar">
            <div id="status-bar"></div>
            <button onclick="mudarAba('aba-chat')">💬 CHAT</button>
            <button onclick="mudarAba('aba-cargos')">🎖️ CARGOS</button>
            <button onclick="mudarAba('aba-membros')">👥 MEMBROS</button>
            <button onclick="mudarAba('aba-noticias')">📢 NOTÍCIAS</button>
            <button onclick="mudarAba('aba-perfil')">👤 PERFIL</button>
            <button id="btn-sair" style="color:#ff4444; margin-top:auto">SAIR</button>
        </aside>

        <main class="content">
            <section id="aba-chat" class="tab-content">
                <div id="chat-messages"></div>
                <div style="display:flex; gap:10px">
                    <input type="text" id="chat-input" placeholder="Ganhe XP conversando...">
                    <button id="chat-send" style="background:#5865f2; color:white; border:none; padding:0 20px; border-radius:6px; cursor:pointer">ENVIAR</button>
                </div>
            </section>

            <section id="aba-membros" class="tab-content" style="display:none">
                <h2>👥 Membros & Gestão</h2>
                <div id="lista-membros" class="card"></div>
            </section>

            <section id="aba-noticias" class="tab-content" style="display:none">
                <div class="card">
                    <h2>📢 Postar Notícia Global</h2>
                    <textarea id="noticia-input" rows="4" placeholder="Escreva aqui..."></textarea>
                    <button id="btn-postar" style="margin-top:10px; background:#ff4500; color:white; border:none; padding:12px 20px; border-radius:6px; cursor:pointer; font-weight:bold">PUBLICAR AGORA</button>
                </div>
            </section>

            <section id="aba-cargos" class="tab-content" style="display:none">
                <div id="tree-root" style="text-align:center">Árvore de Cargos Ativada</div>
            </section>

            <section id="aba-perfil" class="tab-content" style="display:none">
                <div id="perfil-card" class="card"></div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, collection, query, orderBy, addDoc, serverTimestamp, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDK-yme2jxzdjvunQqkuB26r3oKH4OOS0I",
            authDomain: "analitysvss.firebaseapp.com",
            projectId: "analitysvss",
            storageBucket: "analitysvss.firebasestorage.app",
            messagingSenderId: "665486639760",
            appId: "1:665486639760:web:16dd3ee053cd283f5e4e15"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const CARGOS = {
            "1":{n:"INICIANTE",c:"#5865f2",xp:100},"2":{n:"SOLDADO",c:"#fff",xp:200},"3":{n:"CABO",c:"#95a5a6",xp:400},"9":{n:"MARECHAL",c:"#2ecc71"},"10a":{n:"AUTORIDADE",c:"#daa520"},"15":{n:"FUNDADOR",c:"#ff0000"}
        };

        let uData = null;

        // FUNÇÃO DE ABAS
        window.mudarAba = (id) => {
            if(id === 'aba-noticias' && uData.nivel < 10 && uData.nivel != 15) { alert("Sem permissão!"); return; }
            document.querySelectorAll('.tab-content').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        };

        // ADMIN: BANIR E NÍVEL
        window.admAcao = async (tipo, targetUid, nivelAtual) => {
            if(tipo === 'ban') { if(confirm("Banir membro?")) await deleteDoc(doc(db, "usuarios", targetUid)); }
            if(tipo === 'up') { await updateDoc(doc(db, "usuarios", targetUid), { nivel: String(parseInt(nivelAtual) + 1), xp: 0 }); }
            if(tipo === 'down') { await updateDoc(doc(db, "usuarios", targetUid), { nivel: String(parseInt(nivelAtual) - 1), xp: 0 }); }
        };

        onAuthStateChanged(auth, u => {
            if(u) {
                onSnapshot(doc(db, "usuarios", u.uid), s => {
                    if(!s.exists()) { signOut(auth); return; }
                    uData = s.data(); uData.uid = u.uid;
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'flex';
                    const c = CARGOS[uData.nivel] || {n:"MEMBRO", c:"#eee"};
                    document.getElementById('status-bar').innerHTML = `<b>${uData.nome}</b><br>XP: ${uData.xp || 0} | ${c.n}`;
                    document.getElementById('perfil-card').innerHTML = `<h3>${uData.nome}</h3><p>Nível: ${c.n}</p><p>XP Acumulado: ${uData.xp || 0}</p>`;
                });

                // NOTÍCIAS
                onSnapshot(doc(db, "sistema", "news"), s => {
                    if(s.exists()){
                        document.getElementById('news-text').innerText = s.data().t;
                        document.getElementById('top-news-bar').style.display = 'block';
                    }
                });

                // LISTA DE MEMBROS COM BOTÕES DE ADM
                onSnapshot(collection(db, "usuarios"), s => {
                    const l = document.getElementById('lista-membros'); l.innerHTML = "";
                    s.forEach(d => {
                        const m = d.data();
                        const isAdm = (uData.nivel >= 10 || uData.nivel == 15);
                        l.innerHTML += `
                        <div class="membro-row">
                            <span><b>${m.nome}</b> (${CARGOS[m.nivel]?.n || 'Membro'}) - XP: ${m.xp || 0}</span>
                            ${isAdm && d.id !== uData.uid ? `
                                <div class="adm-tools">
                                    <button class="btn-adm" style="background:green" onclick="admAcao('up','${d.id}','${m.nivel}')">+ NV</button>
                                    <button class="btn-adm" style="background:orange" onclick="admAcao('down','${d.id}','${m.nivel}')">- NV</button>
                                    <button class="btn-adm" style="background:red" onclick="admAcao('ban','${d.id}')">BAN</button>
                                </div>
                            ` : ''}
                        </div>`;
                    });
                });

                // CHAT + SISTEMA DE XP
                onSnapshot(query(collection(db, "mensagens"), orderBy("data", "asc")), s => {
                    const b = document.getElementById('chat-messages'); b.innerHTML = "";
                    s.forEach(d => {
                        const msg = d.data();
                        b.innerHTML += `<p><b>${msg.u}:</b> ${msg.t}</p>`;
                    });
                    b.scrollTop = b.scrollHeight;
                });
            }
        });

        // ENVIAR MENSAGEM E GANHAR XP
        document.getElementById('chat-send').onclick = async () => {
            const i = document.getElementById('chat-input');
            if(!i.value.trim()) return;
            await addDoc(collection(db, "mensagens"), { t: i.value, u: uData.nome, nivel: uData.nivel, data: serverTimestamp() });
            await updateDoc(doc(db, "usuarios", uData.uid), { xp: (uData.xp || 0) + 10 });
            i.value = "";
        };

        // POSTAR NOTÍCIA
        document.getElementById('btn-postar').onclick = async () => {
            const t = document.getElementById('noticia-input').value;
            if(t.trim()) {
                await setDoc(doc(db, "sistema", "news"), { t: t });
                document.getElementById('noticia-input').value = "";
                alert("Postado no Topo!");
            }
        };

        document.getElementById('btn-login').onclick = () => signInWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-senha').value);
        document.getElementById('btn-cadastrar').onclick = async () => {
            const r = await createUserWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-senha').value);
            await setDoc(doc(db, "usuarios", r.user.uid), { nome: document.getElementById('reg-nome').value, email: document.getElementById('auth-email').value, nivel: "1", xp: 0 });
        };
        document.getElementById('btn-sair').onclick = () => signOut(auth).then(()=>location.reload());
    </script>
</body>
</html>
