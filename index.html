<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>VSS SYSTEM - HIERARQUIA COMPLETA</title>
    <style>
        body { background: #0a0a0a; color: #eee; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #top-news-bar { position: fixed; top: 0; left: 260px; right: 0; background: #ff4500; color: white; padding: 15px; text-align: center; font-weight: bold; z-index: 1000; display: none; border-bottom: 2px solid #fff; }
        
        .sidebar { width: 260px; background: #111; border-right: 1px solid #222; padding: 20px; display: flex; flex-direction: column; }
        .sidebar button { background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 12px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; text-align: left; font-weight: bold; }
        #status-bar { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #5865f2; font-size: 13px; }

        .content { flex: 1; padding: 80px 30px 30px 30px; overflow-y: auto; background: #0d0d0d; }
        .card { background: #111; padding: 20px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }
        
        /* ÁRVORE DE CARGOS COMPLETA */
        .tree-container { overflow-x: auto; padding-bottom: 20px; }
        .tree ul { padding-top: 20px; position: relative; display: flex; justify-content: center; padding-left: 0; }
        .tree li { list-style: none; position: relative; padding: 20px 5px 0 5px; text-align: center; }
        .tree b { border: 2px solid #444; padding: 8px 12px; display: inline-block; border-radius: 5px; background: #1a1a1a; font-size: 10px; white-space: nowrap; color: #fff; }

        .membro-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #222; }
        .input-xp { width: 60px; background: #000; color: #fff; border: 1px solid #444; padding: 5px; border-radius: 4px; }
        .btn-adm { padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; color: white; font-weight: bold; font-size: 10px; margin-left: 3px; }

        input, textarea { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="top-news-bar">📢 <span id="news-text">...</span></div>

    <div id="auth-screen">
        <div style="background:#111; padding:30px; border-radius:10px; width:300px">
            <h2 style="text-align:center; color:#5865f2">VSS LOGIN</h2>
            <input type="text" id="reg-nome" placeholder="Nome" style="margin-bottom:10px">
            <input type="email" id="auth-email" placeholder="E-mail" style="margin-bottom:10px">
            <input type="password" id="auth-senha" placeholder="Senha" style="margin-bottom:10px">
            <button id="btn-login" style="width:100%; background:#5865f2; color:white; padding:12px; border:none; border-radius:6px; cursor:pointer">ENTRAR / CRIAR</button>
        </div>
    </div>

    <div id="main-app" style="display:none; width:100%;">
        <aside class="sidebar">
            <div id="status-bar"></div>
            <button onclick="mudarAba('aba-chat')">💬 CHAT GLOBAL</button>
            <button onclick="mudarAba('aba-cargos')">🎖️ ÁRVORE DE CARGOS</button>
            <button onclick="mudarAba('aba-membros')">👥 MEMBROS & ADMIN</button>
            <button onclick="mudarAba('aba-noticias')">📢 POSTAR NOTÍCIA</button>
            <button onclick="mudarAba('aba-perfil')">👤 MEU PERFIL</button>
            <button id="btn-sair" style="color:#ff4444; margin-top:auto">SAIR</button>
        </aside>

        <main class="content">
            <section id="aba-chat">
                <div id="chat-messages" style="height:50vh; background:#050505; padding:15px; overflow-y:auto; border-radius:8px; border:1px solid #222; margin-bottom:10px"></div>
                <div style="display:flex; gap:10px">
                    <input type="text" id="chat-input" placeholder="Conversar...">
                    <button id="chat-send" style="background:#5865f2; color:white; padding:0 20px; border:none; border-radius:6px">ENVIAR</button>
                </div>
            </section>

            <section id="aba-cargos" style="display:none">
                <h2>Hierarquia Oficial VSS</h2>
                <div class="tree-container">
                    <div class="tree" id="tree-root"></div>
                </div>
            </section>

            <section id="aba-membros" style="display:none">
                <h2>Gerenciar Membros</h2>
                <div id="lista-membros" class="card"></div>
            </section>

            <section id="aba-noticias" style="display:none">
                <div class="card">
                    <h2>📢 Enviar Notícia (Soma em 1 min)</h2>
                    <textarea id="noticia-input" rows="4" placeholder="Escreva o aviso global..."></textarea>
                    <button id="btn-postar" style="margin-top:10px; background:#ff4500; color:white; padding:12px; border:none; border-radius:6px; cursor:pointer">PUBLICAR AGORA</button>
                </div>
            </section>

            <section id="aba-perfil" style="display:none">
                <div id="perfil-card" class="card"></div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, collection, query, orderBy, addDoc, serverTimestamp, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDK-yme2jxzdjvunQqkuB26r3oKH4OOS0I", authDomain: "analitysvss.firebaseapp.com", projectId: "analitysvss", storageBucket: "analitysvss.firebasestorage.app", messagingSenderId: "665486639760", appId: "1:665486639760:web:16dd3ee053cd283f5e4e15" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        // TODOS OS CARGOS QUE VOCÊ PEDIU
        const CARGOS = {
            "1": {n:"I - INICIANTE", c:"#5865f2"}, "2": {n:"II - SOLDADO", c:"#fff"}, "3": {n:"III - CABO", c:"#95a5a6"},
            "4": {n:"IV - 3º SARGENTO", c:"#bdc3c7"}, "5": {n:"V - 2º SARGENTO", c:"#1abc9c"}, "6": {n:"VI - 1º SARGENTO", c:"#2980b9"},
            "7": {n:"VII - CAPITÃO", c:"#3498db"}, "8": {n:"IX - MAJOR", c:"#27ae60"}, "9": {n:"X - MARECHAL", c:"#2ecc71"},
            "10a": {n:"3º AUTORIDADE", c:"#daa520"}, "11a": {n:"2º AUTORIDADE MAXIMA", c:"#ffd700"}, "12a": {n:"CESAR", c:"#ff8c00"}, "13a": {n:"ANALITY", c:"#ff4500"},
            "10b": {n:"BRAÇO ESQUERDO", c:"#9400d3"}, "11b": {n:"ESPECIAL STAFF", c:"#a29bfe"}, "12b": {n:"SOCIO", c:"#e84118"}, "15": {n:"FUNDADOR", c:"#ff0000"}
        };

        let uD = null;
        window.mudarAba = (id) => {
            if(id==='aba-noticias' && uD.nivel < 9 && uD.nivel != 15) return alert("Apenas Marechal+");
            document.querySelectorAll('section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        };

        window.darXP = async (uid) => {
            const val = parseInt(document.getElementById(`xp-in-${uid}`).value);
            if(!val) return;
            const ref = doc(db, "usuarios", uid);
            const s = await getDoc(ref);
            await updateDoc(ref, { xp: (s.data().xp || 0) + val });
            alert("XP Adicionado com sucesso!");
        };

        window.adm = async (t, uid, n) => {
            if(t==='ban') { if(confirm("Banir permanentemente?")) await deleteDoc(doc(db,"usuarios",uid)); }
            else { await updateDoc(doc(db,"usuarios",uid), { nivel: t==='up'?"15": "1", xp:0 }); } // Simplificado para teste, você pode ajustar
        };

        onAuthStateChanged(auth, u => {
            if(u) {
                onSnapshot(doc(db, "usuarios", u.uid), s => {
                    if(!s.exists()) return; uD = s.data(); uD.uid = u.uid;
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'flex';
                    const c = CARGOS[uD.nivel] || {n:"MEMBRO",c:"#eee"};
                    document.getElementById('status-bar').innerHTML = `<b>${uD.nome}</b><br>${c.n}<br>XP: ${uD.xp||0}`;
                    document.getElementById('perfil-card').innerHTML = `<h2>Meu Perfil</h2><p>Nome: ${uD.nome}</p><p>Cargo Atual: <b style="color:${c.c}">${c.n}</b></p><p>Meu XP: ${uD.xp||0}</p>`;
                });

                onSnapshot(doc(db, "sistema", "news"), s => {
                    if(s.exists()){
                        document.getElementById('news-text').innerText = s.data().t;
                        document.getElementById('top-news-bar').style.display = 'block';
                        setTimeout(() => { document.getElementById('top-news-bar').style.display = 'none'; }, 60000);
                    }
                });

                onSnapshot(collection(db, "usuarios"), s => {
                    const l = document.getElementById('lista-membros'); l.innerHTML = "";
                    s.forEach(d => {
                        const m = d.data(); const isA = (uD.nivel >= 9 || uD.nivel == 15);
                        l.innerHTML += `<div class="membro-row"><span><b>${m.nome}</b> [XP: ${m.xp||0}]</span>
                        ${isA && d.id!==uD.uid ? `<div><input type="number" id="xp-in-${d.id}" class="input-xp" placeholder="XP"><button onclick="darXP('${d.id}')" class="btn-adm" style="background:blue">+XP</button><button onclick="adm('ban','${d.id}')" class="btn-adm" style="background:red">BAN</button></div>`:''}</div>`;
                    });
                });

                onSnapshot(query(collection(db,"mensagens"),orderBy("data","asc")), s => {
                    const b = document.getElementById('chat-messages'); b.innerHTML = "";
                    s.forEach(d => { b.innerHTML += `<p><b>${d.data().u}:</b> ${d.data().t}</p>`; });
                    b.scrollTop = b.scrollHeight;
                });
            }
        });

        document.getElementById('chat-send').onclick = async () => {
            const i = document.getElementById('chat-input'); if(!i.value.trim()) return;
            await addDoc(collection(db, "mensagens"), { t: i.value, u: uD.nome, data: serverTimestamp() });
            i.value = "";
        };

        document.getElementById('btn-postar').onclick = async () => {
            const t = document.getElementById('noticia-input').value;
            if(t.trim()) { await setDoc(doc(db,"sistema","news"), { t: t }); alert("Postado! Sumirá em 1 min."); }
        };

        document.getElementById('btn-login').onclick = async () => {
            const e = document.getElementById('auth-email').value; const p = document.getElementById('auth-senha').value;
            try { await signInWithEmailAndPassword(auth, e, p); } catch {
                const r = await createUserWithEmailAndPassword(auth, e, p);
                await setDoc(doc(db,"usuarios",r.user.uid), { nome: document.getElementById('reg-nome').value, nivel: "1", xp: 0 });
            }
        };

        document.getElementById('btn-sair').onclick = () => signOut(auth).then(()=>location.reload());

        // ÁRVORE DE CARGOS GIGANTE DE VOLTA
        document.getElementById('tree-root').innerHTML = `<ul><li><b style="color:red">${CARGOS[15].n}</b><ul><li><b>${CARGOS["13a"].n}</b><ul><li><b>${CARGOS["12a"].n}</b><ul><li><b>${CARGOS["11a"].n}</b><ul><li><b>${CARGOS["10a"].n}</b><ul><li><b>${CARGOS[9].n}</b><ul><li><b>${CARGOS[3].n}</b><ul><li><b>${CARGOS[2].n}</b><ul><li><b>${CARGOS[1].n}</b></li></ul></li></ul></li></ul></li></ul></li></ul></li></ul></li></ul></li><li><b>${CARGOS["12b"].n}</b><ul><li><b>${CARGOS["11b"].n}</b><ul><li><b>${CARGOS["10b"].n}</b></li></ul></li></ul></li></ul></li></ul>`;
    </script>
</body>
</html>
