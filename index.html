<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA HIERÁRQUICO VSS</title>
    <style>
        body { background: #0a0a0a; color: #eee; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar lateral */
        .sidebar { width: 260px; background: #151515; border-right: 1px solid #222; padding: 20px; display: flex; flex-direction: column; }
        .sidebar button { background: #222; color: #fff; border: 1px solid #333; padding: 12px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; text-align: left; }
        .sidebar button:hover { background: #333; }
        #status-bar { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #5865f2; font-size: 14px; }

        /* Área de Conteúdo */
        .content { flex: 1; padding: 30px; overflow-y: auto; background: #0d0d0d; }
        #chat-messages { height: 60vh; background: #050505; border: 1px solid #222; padding: 15px; overflow-y: auto; border-radius: 8px; margin-bottom: 15px; }
        input { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; }

        /* ÁRVORE HIERÁRQUICA (Estilo CSS conector) */
        .tree ul { padding-top: 20px; position: relative; display: flex; justify-content: center; padding-left: 0; }
        .tree li { float: left; text-align: center; list-style-type: none; position: relative; padding: 20px 5px 0 5px; }
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid #444; width: 50%; height: 20px; }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid #444; }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: none; }
        .tree li:last-child::before { border-right: 2px solid #444; border-radius: 0 5px 0 0; }
        .tree li:first-child::after { border-radius: 5px 0 0 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #444; width: 0; height: 20px; }
        
        /* Estilo das caixas de cargo */
        .tree b { border: 2px solid #444; padding: 8px 12px; display: inline-block; border-radius: 5px; background: #1a1a1a; font-size: 11px; white-space: nowrap; transition: 0.3s; }
        .tree b:hover { background: #333; border-color: #5865f2; transform: scale(1.05); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div id="status-bar">Carregando...</div>
        <button onclick="mudarAba('aba-chat')">💬 CHAT GLOBAL</button>
        <button onclick="mudarAba('aba-cargos')">🎖️ ÁRVORE DE CARGOS</button>
        <button id="btn-sair" style="color:#ff4444; margin-top:auto">SAIR</button>
    </aside>

    <main class="content">
        <section id="aba-chat">
            <div id="chat-messages"></div>
            <div style="display:flex; gap:10px">
                <input type="text" id="chat-input" placeholder="Conversar com a equipe...">
                <button id="chat-send" style="background:#5865f2; color:white; border:none; padding:0 20px; border-radius:6px; cursor:pointer">ENVIAR</button>
            </div>
        </section>

        <section id="aba-cargos" style="display:none">
            <h2 style="text-align:center">Hierarquia da Organização</h2>
            <div class="tree" id="tree-root"></div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDK-yme2jxzdjvunQqkuB26r3oKH4OOS0I",
            authDomain: "analitysvss.firebaseapp.com",
            projectId: "analitysvss",
            storageBucket: "analitysvss.firebasestorage.app",
            messagingSenderId: "665486639760",
            appId: "1:665486639760:web:16dd3ee053cd283f5e4e15"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const CARGOS = {
            "1": {n:"I - INICIANTE", c:"#5865f2"}, "2": {n:"II - SOLDADO", c:"#fff"}, "3": {n:"III - CABO", c:"#95a5a6"},
            "4": {n:"IV - 3º SARGENTO", c:"#bdc3c7"}, "5": {n:"V - 2º SARGENTO", c:"#1abc9c"}, "6": {n:"VI - 1º SARGENTO", c:"#2980b9"},
            "7": {n:"VII - CAPITÃO", c:"#3498db"}, "8": {n:"IX - MAJOR", c:"#27ae60"}, "9": {n:"X - MARECHAL", c:"#2ecc71"},
            "10a": {n:"3º AUTORIDADE (A)", c:"#daa520"}, "11a": {n:"2º AUTORIDADE MAXIMA (A)", c:"#ffd700"}, "12a": {n:"CESAR (A)", c:"#ff8c00"}, "13a": {n:"ANALITY (A)", c:"#ff4500"},
            "10b": {n:"SÓCIO (B)", c:"#9400d3"}, "11b": {n:"STAFF ESPECIAL (B)", c:"#a29bfe"}, "15": {n:"FUNDADOR", c:"#ff0000"}
        };

        let uD = null;
        window.mudarAba = (id) => {
            document.getElementById('aba-chat').style.display = 'none';
            document.getElementById('aba-cargos').style.display = 'none';
            document.getElementById(id).style.display = 'block';
        };

        onAuthStateChanged(auth, u => {
            if(u) {
                onSnapshot(doc(db, "usuarios", u.uid), s => {
                    uD = s.data(); uD.uid = u.uid;
                    document.getElementById('main-app').style.display = 'flex';
                    const c = CARGOS[uD.nivel] || {n:"MEMBRO", c:"#eee"};
                    document.getElementById('status-bar').innerHTML = `<b>${uD.nome}</b><br><span style="color:${c.c}">${c.n}</span>`;
                });
                onSnapshot(query(collection(db, "mensagens"), orderBy("data", "asc")), s => {
                    const b = document.getElementById('chat-messages'); b.innerHTML = "";
                    s.forEach(d => { b.innerHTML += `<p><b>${d.data().u}:</b> ${d.data().t}</p>`; });
                    b.scrollTop = b.scrollHeight;
                });
            }
        });

        document.getElementById('chat-send').onclick = async () => {
            const i = document.getElementById('chat-input'); if(!i.value.trim()) return;
            await addDoc(collection(db, "mensagens"), { t: i.value, u: uD.nome, data: serverTimestamp() });
            i.value = "";
        };

        document.getElementById('btn-sair').onclick = () => signOut(auth).then(()=>location.reload());

        // CONSTRUÇÃO DA ÁRVORE (ÚNICA ATÉ MARECHAL)
        document.getElementById('tree-root').innerHTML = `
            <ul>
                <li><b style="color:${CARGOS[15].c}">${CARGOS[15].n}</b>
                    <ul>
                        <li><b style="color:${CARGOS[9].c}">${CARGOS[9].n}</b>
                            <ul>
                                <li><b style="color:${CARGOS["10a"].c}">${CARGOS["10a"].n}</b><ul><li><b style="color:${CARGOS["11a"].c}">${CARGOS["11a"].n}</b><ul><li><b style="color:${CARGOS["12a"].c}">${CARGOS["12a"].n}</b><ul><li><b style="color:${CARGOS["13a"].c}">${CARGOS["13a"].n}</b></li></ul></li></ul></li></ul></li>
                                <li><b style="color:${CARGOS["10b"].c}">${CARGOS["10b"].n}</b><ul><li><b style="color:${CARGOS["11b"].c}">${CARGOS["11b"].n}</b></li></ul></li>
                            </ul>
                        </li>
                    </ul>
                </li>
            </ul>
            <div style="text-align:center; padding-top:20px;">
                <b style="color:${CARGOS[8].c}">${CARGOS[8].n}</b><br>
                <b style="color:${CARGOS[7].c}">${CARGOS[7].n}</b><br>
                <b style="color:${CARGOS[6].c}">${CARGOS[6].n}</b><br>
                <b style="color:${CARGOS[5].c}">${CARGOS[5].n}</b><br>
                <b style="color:${CARGOS[4].c}">${CARGOS[4].n}</b><br>
                <b style="color:${CARGOS[3].c}">${CARGOS[3].n}</b><br>
                <b style="color:${CARGOS[2].c}">${CARGOS[2].n}</b><br>
                <b style="color:${CARGOS[1].c}">${CARGOS[1].n}</b>
            </div>`;
    </script>
</body>
</html>
