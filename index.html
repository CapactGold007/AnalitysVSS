<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>VSS SYSTEM - VERSÃO GOLD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #070707; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 280px; background: #111; border-right: 1px solid #222; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        .sidebar button { background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; font-weight: bold; transition: 0.3s; }
        .sidebar button:hover { background: #5865f2; }
        
        #status-bar { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #5865f2; font-size: 14px; }
        #status-bar b { color: #5865f2; }

        /* ÁREA CENTRAL */
        .content { flex: 1; padding: 40px; overflow-y: auto; background: #0d0d0d; }
        .card { background: #111; padding: 25px; border-radius: 12px; border: 1px solid #222; margin-bottom: 25px; }
        
        .sub-nav { display: flex; gap: 10px; margin-bottom: 20px; background: #1a1a1a; padding: 10px; border-radius: 8px; }
        .sub-nav button { flex: 1; padding: 10px; border: none; border-radius: 6px; background: #222; color: #ccc; cursor: pointer; }
        .sub-nav button.active { background: #5865f2; color: #fff; }

        input, textarea { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 8px; width: 100%; margin-bottom: 10px; outline: none; }
        .btn-acao { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; }
        
        /* LISTAS */
        #chat-box, #mural-lista, #lista-membros-ui { height: 45vh; overflow-y: auto; background: #050505; border-radius: 10px; padding: 15px; border: 1px solid #222; }
        .membro-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #222; align-items: center; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }

        /* PERFIL */
        .perfil-header { text-align: center; margin-bottom: 20px; }
        .perfil-header .avatar { width: 80px; height: 80px; background: #5865f2; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-bold: true; }

        #auth-screen { position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="card" style="width:360px; text-align:center;">
            <h2 style="color:#5865f2; margin-bottom: 20px;">VSS SYSTEM</h2>
            <div id="login-fields">
                <input type="email" id="l-email" placeholder="E-mail">
                <input type="password" id="l-senha" placeholder="Senha">
                <button onclick="fLogin()" class="btn-acao" style="background:#5865f2; width:100%">ACESSAR</button>
                <p style="margin-top:20px; cursor:pointer" onclick="toggleAuth(true)">Registrar </p>
            </div>
            <div id="reg-fields" style="display:none">
                <input type="text" id="r-nome" placeholder="Nome do Staff">
                <input type="email" id="r-email" placeholder="E-mail">
                <input type="password" id="r-senha" placeholder="Senha">
                <button onclick="fRegistro()" class="btn-acao" style="background:#2ecc71; width:100%">CADASTRAR</button>
                <p style="margin-top:20px; cursor:pointer" onclick="toggleAuth(false)">Voltar ao Login</p>
            </div>
        </div>
    </div>

    <div id="main-app" style="display:none; width:100%;">
        <aside class="sidebar">
            <div id="status-bar">Carregando...</div>
            <button onclick="aba('aba-chat')">💬 CHAT GLOBAL</button>
            <button onclick="aba('aba-perfil')">👤 MEU PERFIL</button>
            <button onclick="aba('aba-cargos')">🎖️ HIERARQUIA (20)</button>
            <button onclick="aba('aba-membros')">👥 MEMBROS ATIVOS</button>
            <button onclick="aba('aba-noticias-master')">📢 NOTÍCIAS & MURAL</button>
            <button onclick="aba('aba-prova')" style="background:#400; border:1px solid red;">🤖 PROVA IA</button>
            <button id="btn-sair" style="color:#ff4444; margin-top:auto; border:none; background:none; cursor:pointer;">✖ LOGOUT</button>
        </aside>

        <main class="content">
            <section id="aba-perfil" style="display:none">
                <h2>MEU PERFIL </h2>
                <div class="card">
                    <div id="perfil-info-dinamica"></div>
                </div>
            </section>

            <section id="aba-cargos" style="display:none">
                <h2>HIERARQUIA VSS - 20 NÍVEIS</h2>
                <div class="card" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div id="cargos-col-1"></div>
                    <div id="cargos-col-2"></div>
                </div>
            </section>

            <section id="aba-membros" style="display:none">
                <h2>MEMBROS</h2>
                <div class="card">
                    <div id="lista-membros-ui"></div>
                </div>
            </section>

            <section id="aba-noticias-master" style="display:none">
                <div class="sub-nav">
                    <button onclick="subAba('mural')" id="btn-mural" class="active">MURAL</button>
                    <button onclick="subAba('noticias')" id="btn-noticias">NOTÍCIAS</button>
                    <button onclick="subAba('criar')" id="btn-criar">CRIAR</button>
                </div>
                <div id="sub-mural"><input type="text" id="mural-input" placeholder="Mural..."><div id="mural-lista"></div></div>
                <div id="sub-noticias" style="display:none"><div id="noticias-lista"></div></div>
                <div id="sub-criar" style="display:none">
                    <input type="text" id="news-title" placeholder="Título"><textarea id="news-desc" rows="5"></textarea>
                    <button id="btn-postar-news" class="btn-acao" style="background:#5865f2; width:100%">POSTAR</button>
                </div>
            </section>

            <section id="aba-prova" style="display:none">
                <div class="card"><h2>PROVA IA</h2><div id="questoes-lista"></div><button onclick="finalizarProva()" class="btn-acao" style="background:green; width:100%; margin-top:20px">ENVIAR</button></div>
            </section>

            <section id="aba-chat"><h2>CHAT</h2><div id="chat-box"></div><input type="text" id="chat-input" placeholder="Mensagem..."></section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, orderBy, addDoc, serverTimestamp, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDK-yme2jxzdjvunQqkuB26r3oKH4OOS0I", authDomain: "analitysvss.firebaseapp.com", projectId: "analitysvss", storageBucket: "analitysvss.firebasestorage.app", messagingSenderId: "665486639760", appId: "1:665486639760:web:16dd3ee053cd283f5e4e15" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        const CARGOS_20 = {
            "1": "Recruta", "2": "Soldado", "3": "Cabo", "4": "Sargento", "5": "Subtenente",
            "6": "Tenente", "7": "Capitão", "8": "Major", "9": "Coronel", "10": "Marechal",
            "11": "Mestre VSS", "12": "Conselheiro", "13": "Líder de Divisão", "14": "Vigilante", "15": "Supervisor",
            "16": "Administrador", "17": "Diretor", "18": "Braço Direito", "19": "Co-Fundador", "20": "FUNDADOR SUPREMO"
        };

        let uD = null;
        window.aba = (id) => { 
            document.querySelectorAll('section').forEach(s => s.style.display = 'none'); 
            document.getElementById(id).style.display = 'block';
            if(id==='aba-perfil') renderPerfil();
            if(id==='aba-cargos') renderHierarquia();
            if(id==='aba-membros') renderMembros();
        };
        window.subAba = (id) => { 
            document.getElementById('sub-mural').style.display = id==='mural'?'block':'none';
            document.getElementById('sub-noticias').style.display = id==='noticias'?'block':'none';
            document.getElementById('sub-criar').style.display = id==='criar'?'block':'none';
        };

        onAuthStateChanged(auth, u => {
            if(u) {
                onSnapshot(doc(db, "usuarios", u.uid), s => {
                    uD = s.data(); uD.uid = u.uid;
                    document.getElementById('auth-screen').style.display='none';
                    document.getElementById('main-app').style.display='flex';
                    document.getElementById('status-bar').innerHTML = `<b>${uD.nome}</b><br>${CARGOS_20[uD.nivel] || 'Staff'}`;
                });
                carregarNoticias(); carregarMensagens(); carregarMural();
            }
        });

        // PERFIL FUNCIONAL
        function renderPerfil() {
            const div = document.getElementById('perfil-info-dinamica');
            div.innerHTML = `
                <div class="perfil-header">
                    <div class="avatar">${uD.nome[0].toUpperCase()}</div>
                    <h2>${uD.nome}</h2>
                    <p style="color:#5865f2">${CARGOS_20[uD.nivel]}</p>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; text-align:center">
                    <div class="card" style="background:#050505">Nível<br><b>${uD.nivel}</b></div>
                    <div class="card" style="background:#050505">Status<br><b style="color:#2ecc71">ATIVO</b></div>
                </div>
                <p style="font-size:12px; color:#555; text-align:center">ID: ${uD.uid}</p>
            `;
        }

        // HIERARQUIA COMPLETA
        function renderHierarquia() {
            const col1 = document.getElementById('cargos-col-1');
            const col2 = document.getElementById('cargos-col-2');
            col1.innerHTML = ""; col2.innerHTML = "";
            Object.entries(CARGOS_20).forEach(([lv, nome], index) => {
                const item = `<div style="margin-bottom:8px"><b>Lvl ${lv}:</b> ${nome}</div>`;
                if(index < 10) col1.innerHTML += item; else col2.innerHTML += item;
            });
        }

        // LISTA DE MEMBROS
        async function renderMembros() {
            const div = document.getElementById('lista-membros-ui');
            div.innerHTML = "Carregando...";
            const s = await getDocs(collection(db, "usuarios"));
            div.innerHTML = "";
            s.forEach(d => {
                const m = d.data();
                div.innerHTML += `
                    <div class="membro-item">
                        <span><b>${m.nome}</b></span>
                        <span class="badge" style="background:${m.nivel == '20' ? 'red' : '#333'}">${CARGOS_20[m.nivel]}</span>
                    </div>
                `;
            });
        }

        // NOTICIAS / MURAL / CHAT (IGUAL ANTERIOR, MAS INTEGRADO)
        function carregarNoticias() {
            onSnapshot(query(collection(db, "noticias"), orderBy("data", "desc")), s => {
                const b = document.getElementById('noticias-lista'); b.innerHTML = "";
                s.forEach(d => {
                    const n = d.data(); const id = d.id;
                    b.innerHTML += `<div class="card"><h3>${n.titulo}</h3><p id="txt-${id}">${n.desc}</p>
                        <small>Autor: ${n.u}</small><br>
                        ${n.uUid === uD.uid ? `<button onclick="editarN('${id}')" style="color:orange; background:none; border:none; cursor:pointer">Editar</button>` : ""}
                        <div id="coms-${id}"></div>
                        <input type="text" id="in-com-${id}" placeholder="Comentar..." onkeypress="if(event.key==='Enter') comentarN('${id}')">
                    </div>`;
                    carregarComs(id);
                });
            });
        }

        window.comentarN = async (id) => {
            const inp = document.getElementById('in-com-'+id);
            if(inp.value) await addDoc(collection(db, "noticias", id, "comentarios"), { u: uD.nome, t: inp.value, data: serverTimestamp() });
            inp.value = "";
        };

        function carregarComs(id) {
            onSnapshot(query(collection(db, "noticias", id, "comentarios"), orderBy("data", "asc")), s => {
                const d = document.getElementById('coms-'+id); if(!d) return;
                d.innerHTML = ""; s.forEach(c => { d.innerHTML += `<div style="font-size:12px; margin-top:5px"><b>${c.data().u}:</b> ${c.data().t}</div>`; });
            });
        }

        window.editarN = async (id) => {
            const n = prompt("Novo texto:", document.getElementById('txt-'+id).innerText);
            if(n) await updateDoc(doc(db, "noticias", id), { desc: n });
        };

        // ... OUTROS SCRIPTS (MURAL/CHAT) ...
        function carregarMural() {
            onSnapshot(query(collection(db, "mural"), orderBy("data", "desc")), s => {
                const b = document.getElementById('mural-lista'); b.innerHTML = "";
                s.forEach(d => { b.innerHTML += `<div style="padding:10px; border-bottom:1px solid #222"><b>${d.data().u}:</b> ${d.data().t}</div>`; });
            });
        }
        document.getElementById('mural-input').onkeypress = async (e) => {
            if(e.key === 'Enter' && e.target.value) {
                await addDoc(collection(db, "mural"), { u: uD.nome, t: e.target.value, data: serverTimestamp() });
                e.target.value = "";
            }
        };
        function carregarMensagens() {
            onSnapshot(query(collection(db, "mensagens"), orderBy("data", "asc")), s => {
                const b = document.getElementById('chat-box'); b.innerHTML = "";
                s.forEach(d => { b.innerHTML += `<div><b>${d.data().u}:</b> ${d.data().t}</div>`; });
                b.scrollTop = b.scrollHeight;
            });
        }
        document.getElementById('chat-input').onkeypress = async (e) => {
            if(e.key === 'Enter' && e.target.value) {
                await addDoc(collection(db, "mensagens"), { u: uD.nome, t: e.target.value, data: serverTimestamp() });
                e.target.value = "";
            }
        };

        window.fLogin = () => signInWithEmailAndPassword(auth, document.getElementById('l-email').value, document.getElementById('l-senha').value);
        window.fRegistro = async () => {
            const r = await createUserWithEmailAndPassword(auth, document.getElementById('r-email').value, document.getElementById('r-senha').value);
            await setDoc(doc(db, "usuarios", r.user.uid), { nome: document.getElementById('r-nome').value, nivel: "1", uUid: r.user.uid });
        };
        window.toggleAuth = (reg) => { document.getElementById('login-fields').style.display = reg?'none':'block'; document.getElementById('reg-fields').style.display = reg?'block':'none'; };
        document.getElementById('btn-sair').onclick = () => signOut(auth).then(()=>location.reload());
    </script>
</body>
</html>
