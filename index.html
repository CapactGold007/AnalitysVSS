<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>X1 Lendário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-container">
        <div id="menu">
            <h1>LENDÁRIOS 2D</h1>
            <div id="main-options">
                <button onclick="showCreateRoom()">CRIAR SALA</button>
                <button onclick="showJoinRoom()">JUNTAR-SE</button>
            </div>
            <div id="create-area" class="hidden">
                <p>Código: <span id="room-code-display">0000</span></p>
                <button onclick="startGame()">COMEÇAR</button>
            </div>
            <div id="join-area" class="hidden">
                <input type="text" id="room-input" maxlength="4" placeholder="Código">
                <button onclick="joinRoom()">ENTRAR</button>
            </div>
        </div>
    </div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <!-- O script deve estar aqui no final -->
    <script src="script.js"></script>
</body>
</html>
