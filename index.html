<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>VSS SYSTEM - OFICIAL</title>
    <style>
        body { background: #0a0a0a; color: #eee; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; }
        
        /* Telas */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .auth-box { background: #111; padding: 30px; border: 1px solid #333; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; width: 300px; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: #151515; border-right: 1px solid #222; padding: 20px; display: flex; flex-direction: column; }
        .sidebar button { background: #222; color: #fff; border: 1px solid #333; padding: 12px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; text-align: left; font-weight: bold; transition: 0.2s; }
        .sidebar button:hover { background: #333; border-color: #5865f2; }
        #status-bar { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #5865f2; font-size: 14px; }

        .content { flex: 1; padding: 30px; overflow-y: auto; background: #0d0d0d; }
        #chat-messages { height: 60vh; background: #050505; border: 1px solid #222; padding: 15px; overflow-y: auto; border-radius: 8px; margin-bottom: 15px; }
        input { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 6px; }

        /* Estilo da Árvore (Cargos) */
        .tree-container { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .tree ul { padding-top: 20px; position: relative; display: flex; justify-content: center; padding-left: 0; }
        .tree li { list-style-type: none; position: relative; padding: 20px 5px 0 5px; text-align: center; }
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid #444; width: 50%; height: 20px; }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid #444; }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: none; }
        .tree li:last-child::before { border-right: 2px solid #444; border-radius: 0 5px 0 0; }
        .tree li:first-child::after { border-radius: 5px 0 0 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #444; width: 0; height: 20px; }
        .tree b { border: 2px solid #444; padding: 8px 15px; display: inline-block; border-radius: 5px; background: #1a1a1a; font-size: 12px; }

        /* Cartões e Listas */
        .card { background: #111; padding: 20px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }
        .membro-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #222; align-items: center; }
        .badge-cargo { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h2 style="text-align:center; color:#5865f2">VSS SYSTEM</h2>
            <input type="text" id="reg-nome" placeholder="Seu Nome">
            <input type="email" id="auth-email" placeholder="E-mail">
            <input type="password" id="auth-senha" placeholder="Senha">
            <button id="btn-login" style="background:#5865f2; border:none; color:white">ENTRAR</button>
            <button id="btn-cadastrar" style="background:#333; color:white">CRIAR CONTA</button>
        </div>
    </div>

    <div id="main-app" style="display:none; width:100%;">
        <aside class="sidebar">
            <div id="status-bar"></div>
            <button onclick="aba('aba-chat')">💬 CHAT GLOBAL</button>
            <button onclick="aba('aba-cargos')">🎖️ CARGOS</button>
            <button onclick="aba('aba-membros')">👥 MEMBROS</button>
            <button onclick="aba('aba-regras')">📜 REGRAS VSS</button>
            <button id="btn-sair" style="color:#ff4444; margin-top:auto">SAIR</button>
        </aside>

        <main class="content">
            <section id="aba-chat">
                <div id="chat-messages"></div>
                <div style="display:flex; gap:10px">
                    <input type="text" id="chat-input" style="flex:1" placeholder="Mensagem...">
                    <button id="chat-send" style="background:#5865f2; color:white; padding:10px 20px; border:none; border-radius:5px">ENVIAR</button>
                </div>
            </section>

            <section id="aba-cargos" style="display:none">
                <div class="tree-container"><div class="tree" id="tree-root"></div></div>
            </section>

            <section id="aba-membros" style="display:none">
                <h2>👥 Membros Registrados</h2>
                <div id="lista-membros" class="card"></div>
            </section>

            <section id="aba-regras" style="display:none">
                <div class="card">
                    <h2 style="color:#ff4444; border-bottom: 1px solid #333; padding-bottom: 10px;">REGRAS DO SISTEMA</h2>
                    <ul style="font-size: 18px; line-height: 2.5; list-style: none; padding: 0;">
                        <li>🚫 <b>NÃO MENTIR</b></li>
                        <li>🙏 <b>CRER EM DEUS</b></li>
                        <li>🫡 <b>RESPEITAR SEU SUPERIOR</b></li>
                        <li>🤬 <b>NÃO XINGAR</b></li>
                        <li>🤝 <b>ACEITAR QUE PERDEU</b></li>
                    </ul>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDK-yme2jxzdjvunQqkuB26r3oKH4OOS0I",
            authDomain: "analitysvss.firebaseapp.com",
            projectId: "analitysvss",
            storageBucket: "analitysvss.firebasestorage.app",
            messagingSenderId: "665486639760",
            appId: "1:665486639760:web:16dd3ee053cd283f5e4e15"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const CARGOS = {
            "1": {n:"I - INICIANTE", c:"#5865f2"}, "2": {n:"II - SOLDADO", c:"#fff"}, "3": {n:"III - CABO", c:"#95a5a6"},
            "4": {n:"IV - 3º SARGENTO", c:"#bdc3c7"}, "5": {n:"V - 2º SARGENTO", c:"#1abc9c"}, "6": {n:"VI - 1º SARGENTO", c:"#2980b9"},
            "7": {n:"VII - CAPITÃO", c:"#3498db"}, "8": {n:"IX - MAJOR", c:"#27ae60"}, "9": {n:"X - MARECHAL", c:"#2ecc71"},
            "10a": {n:"3º AUTORIDADE", c:"#daa520"}, "11a": {n:"2º AUTORIDADE MAXIMA", c:"#ffd700"}, "12a": {n:"CESAR", c:"#ff8c00"}, "13a": {n:"ANALITY", c:"#ff4500"},
            "10b": {n:"BRAÇO ESQUERDO", c:"#9400d3"}, "11b": {n:"ESPECIAL STAFF", c:"#a29bfe"}, "12b": {n:"SOCIO", c:"#e84118"}, "15": {n:"FUNDADOR", c:"#ff0000"}
        };

        function renderTree() {
            return `<ul><li><b>${CARGOS[1].n}</b><ul><li><b>${CARGOS[2].n}</b><ul><li><b>${CARGOS[3].n}</b><ul><li><b>${CARGOS[4].n}</b><ul><li><b>${CARGOS[5].n}</b><ul><li><b>${CARGOS[6].n}</b><ul><li><b>${CARGOS[7].n}</b><ul><li><b>${CARGOS[8].n}</b><ul><li><b style="color:${CARGOS[9].c}">${CARGOS[9].n}</b>
            <ul><li><b>${CARGOS["10a"].n}</b><ul><li><b>${CARGOS["11a"].n}</b><ul><li><b>${CARGOS["12a"].n}</b><ul><li><b>${CARGOS["13a"].n}</b><ul><li><b style="color:red">${CARGOS[15].n}</b></li></ul></li></ul></li></ul></li></ul></li>
            <li><b>${CARGOS["10b"].n}</b><ul><li><b>${CARGOS["11b"].n}</b><ul><li><b>${CARGOS["12b"].n}</b><ul><li><b style="color:red">${CARGOS[15].n}</b></li></ul></li></ul></li></ul></li></ul>
            </li></ul></li></ul></li></ul></li></ul></li></ul></li></ul></li></ul></li></ul></li></ul>`;
        }

        let userD = null;
        window.aba = (id) => { ['aba-chat','aba-cargos','aba-membros','aba-regras'].forEach(a => document.getElementById(a).style.display = a === id ? 'block' : 'none'); };

        onAuthStateChanged(auth, u => {
            if(u) {
                onSnapshot(doc(db, "usuarios", u.uid), s => {
                    userD = s.data();
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'flex';
                    const c = CARGOS[userD.nivel] || CARGOS[1];
                    document.getElementById('status-bar').innerHTML = `Logado: <b>${userD.nome}</b><br><span style="color:${c.c}">${c.n}</span>`;
                    document.getElementById('tree-root').innerHTML = renderTree();
                });
                
                onSnapshot(collection(db, "usuarios"), s => {
                    const list = document.getElementById('lista-membros'); list.innerHTML = "";
                    s.forEach(d => {
                        const m = d.data(); const c = CARGOS[m.nivel] || CARGOS[1];
                        list.innerHTML += `<div class="membro-item">
                            <span><b>${m.nome}</b></span>
                            <span class="badge-cargo" style="border: 1px solid ${c.c}; color: ${c.c}">${c.n}</span>
                        </div>`;
                    });
                });

                onSnapshot(query(collection(db, "mensagens"), orderBy("data", "asc")), s => {
                    const box = document.getElementById('chat-messages'); box.innerHTML = "";
                    s.forEach(d => {
                        const m = d.data(); const c = CARGOS[m.nivel] || CARGOS[1];
                        box.innerHTML += `<p><b style="color:${c.c}">[${c.n}] ${m.u}:</b> ${m.t}</p>`;
                    });
                    box.scrollTop = box.scrollHeight;
                });
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
            }
        });

        document.getElementById('btn-login').onclick = () => signInWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-senha').value);
        document.getElementById('btn-cadastrar').onclick = async () => {
            const r = await createUserWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-senha').value);
            await setDoc(doc(db, "usuarios", r.user.uid), { nome: document.getElementById('reg-nome').value, email: document.getElementById('auth-email').value, nivel: "1" });
        };
        document.getElementById('chat-send').onclick = async () => {
            const i = document.getElementById('chat-input'); if(!i.value.trim()) return;
            await addDoc(collection(db, "mensagens"), { t: i.value, u: userD.nome, nivel: String(userD.nivel), data: serverTimestamp() });
            i.value = "";
        };
        document.getElementById('btn-sair').onclick = () => signOut(auth).then(()=>location.reload());
    </script>
</body>
</html>
